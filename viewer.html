<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">EPUB 预览</title>
  <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
    #viewer { width: 100vw; height: 100vh; }
    #toolbar { position: fixed; top: 0; left: 0; right: 0; background: #222; color: #fff; padding: 8px; display: flex; justify-content: space-between; align-items: center; }
    button { background: #555; color: #fff; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    button:hover { background: #777; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="book-title"></span>
    <div>
      <button id="prev">上一页</button>
      <button id="next">下一页</button>
    </div>
  </div>
  <div id="viewer"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const title = params.get("title") || file;
    document.title = title;
    document.getElementById("book-title").textContent = title;

    const book = ePub(`archive/${file}`);
    const rendition = book.renderTo("viewer", {
      width: "100%",
      height: "100vh",
      flow: "paginated"
    });
    rendition.display();

    document.getElementById("prev").onclick = () => rendition.prev();
    document.getElementById("next").onclick = () => rendition.next();
  </script>
</body>
</html>
